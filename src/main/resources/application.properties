spring.application.name=SGTPRO

# Base de datos - usar variables de entorno en produccion
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sgtpro}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
logging.level.org.hibernate.SQL=debug

spring.thymeleaf.cache=false

# JWT
jwt.secret-key=${JWT_SECRET:VGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3ItU0dUcHJvLWV4YW1wbGUtMTIzNDU2Nzg5MA==}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Paginacion
app.page-size=${PAGE_SIZE:8}
